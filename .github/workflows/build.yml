name: 编译 ImmortalWrt RAX3000Me NAND DDR4 无USB版
on:
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  TARGET: mediatek/filogic
  PROFILE: cmcc_rax3000me
  BRANCH: openwrt-24.10
  REPO: immortalwrt/immortalwrt
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  APT_CACHE_DIR: ${{ github.workspace }}/.aptcache
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取仓库配置和files文件
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # APT包缓存
      - name: 恢复APT缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: ${{ runner.os }}-apt-openwrt
          restore-keys: |
            ${{ runner.os }}-apt-

      # 配置清华源，修复EOF语法错误
      - name: 配置清华APT源+缓存目录
        run: |
          sudo cp /etc/apt/sources.list /etc/apt/sources.list.bak
          sudo printf "deb https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ jammy main restricted universe multiverse\ndeb https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ jammy-updates main restricted universe multiverse\ndeb https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ jammy-security main restricted universe multiverse\n" > /etc/apt/sources.list
          sudo mkdir -p ${{ env.APT_CACHE_DIR }}
          echo "Dir::Cache::archives \"${{ env.APT_CACHE_DIR }}\";" | sudo tee /etc/apt/apt.conf.d/99cache

      # 只安装5个缺失依赖
      - name: 安装精简编译依赖
        run: |
          sudo apt update
          sudo apt install -y libncurses-dev libssl-dev libelf-dev ccache device-tree-compiler

      # ccache编译缓存
      - name: 恢复ccache编译缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ env.BRANCH }}-${{ hashFiles('.config') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.BRANCH }}-

      - name: 拉取ImmortalWrt源码，导入配置
        run: |
          git clone -b ${{ env.BRANCH }} --depth=1 https://${{ github.token }}@github.com/${{ env.REPO }}.git openwrt
          cd openwrt
          cp ../.config .
          rsync -av ../files/ ./files/
          sed -i '/CONFIG_PACKAGE_default-settings/d' .config
          sed -i '/CONFIG_PACKAGE_default-settings-chn/d' .config
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 配置ccache
        run: |
          ccache -M 10G
          ccache -o compression=true
          ccache -z
          ccache -s

      - name: 开始编译固件（启用ccache加速）
        run: |
          cd openwrt
          export PATH="/usr/lib/ccache:$PATH"
          make -j$(nproc) V=s

      - name: 打印ccache缓存统计
        run: ccache -s

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: RAX3000Me‑DDR4‑NOUSB‑${{ env.BRANCH }}
          path: |
            openwrt/bin/targets/${{ env.TARGET }}/*cmcc_rax3000me*.itb
            openwrt/bin/targets/${{ env.TARGET }}/*cmcc_rax3000me-nand-ddr4-preloader.bin
            openwrt/bin/targets/${{ env.TARGET }}/*cmcc_rax3000me-nand-ddr4-bl31-uboot.fip
            openwrt/bin/targets/${{ env.TARGET }}/sha256sums
