      - name: 恢复APT包缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.APT_CACHE_DIR }}
          key: ${{ runner.os }}-apt-blmt798x
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: 更换清华APT源 + 配置apt缓存目录
        run: |
          sudo cp /etc/apt/sources.list /etc/apt/sources.list.bak
          sudo printf "deb https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ jammy main restricted universe multiverse\ndeb https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ jammy-updates main restricted universe multiverse\ndeb https://mirrors.tuna.tsinghua.edu.cn/ubuntu/ jammy-security main restricted universe multiverse\n" > /etc/apt/sources.list
          sudo mkdir -p ${{ env.APT_CACHE_DIR }}
          echo "Dir::Cache::archives \"${{ env.APT_CACHE_DIR }}\";" | sudo tee /etc/apt/apt.conf.d/99cache

      - name: 安装缺失编译依赖（仅装系统没有的）
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu libssl-dev device-tree-compiler

      - name: 使用仓库内置bl-mt798x源码编译
        run: |
          cd bl-mt798x
          SOC=${{ env.SOC }} BOARD=${{ env.BOARD }} DDR=${{ env.DDR }} FLASH=${{ env.FLASH }} ./build.sh
